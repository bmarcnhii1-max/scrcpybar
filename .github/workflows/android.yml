name: Android (companion APK)

on:
  push:
    branches: [master]
    paths:
      - 'ScrcpyBar.Android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ScrcpyBar.Android
        run: chmod +x gradlew && ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyBar.Companion-debug
          path: ScrcpyBar.Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
